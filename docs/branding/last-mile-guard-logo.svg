<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-label="Last Mile Guard logo">
  <title>Last Mile Guard</title>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14396B"/>
      <stop offset="1" stop-color="#0A1F3D"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="980" height="300" fill="#FFFFFF"/>
  <!-- icon, scaled to fit the height -->
  <g transform="translate(34 24) scale(0.5)">
    <path d="M256 40 L440 110 V250 C440 360 360 440 256 480 C152 440 72 360 72 250 V110 Z" fill="url(#shield)"/>
    <path d="M256 62 L420 124 V250 C420 345 351 418 256 455 C161 418 92 345 92 250 V124 Z"
          fill="none" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="3"/>
    <circle cx="150" cy="392" r="8"  fill="url(#trail)" opacity="0.55"/>
    <circle cx="182" cy="352" r="10" fill="url(#trail)" opacity="0.7"/>
    <circle cx="218" cy="318" r="12" fill="url(#trail)" opacity="0.85"/>
    <circle cx="258" cy="286" r="14" fill="url(#trail)"/>
    <circle cx="306" cy="212" r="62" fill="#0A1F3D" stroke="#2DD4BF" stroke-width="16"/>
    <path d="M280 214 L300 236 L335 190" fill="none" stroke="#FFFFFF" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <text x="330" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92"
        font-weight="800" letter-spacing="2" fill="#0A1F3D">LAST MILE</text>
  <text x="332" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="82"
        font-weight="300" letter-spacing="18" fill="#14B8A6">GUARD</text>
  <text x="334" y="270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22"
        letter-spacing="3" fill="#64748B">A SECOND LOOK BEFORE THE MONEY MOVES</text>
</svg>
