<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1100" width="1900" height="1100" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#5b6b86"/></marker></defs>
<rect width="1900" height="1100" fill="#f6f8fc"/><text x="40" y="56" font-size="34" font-weight="700" fill="#14213d" text-anchor="start">Last Mile Guard: end-to-end system architecture</text><text x="40" y="88" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Google Cloud Run + Vertex AI Gemini  ·  all payments, customers and accounts are made up</text><rect x="40" y="150" width="270" height="110" rx="14" fill="#e8f0ff" stroke="#4b7bec" stroke-width="2"/><text x="56" y="178" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Visitor's browser</text><text x="56" y="204" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• React web app</text><text x="56" y="228" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Live view of each stage</text><rect x="40" y="420" width="270" height="110" rx="14" fill="#fdeaea" stroke="#d64545" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="448" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Voice input (optional)</text><text x="56" y="474" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Speech to text in the browser</text><text x="56" y="498" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Chrome uses Google's service</text><rect x="40" y="560" width="270" height="90" rx="14" fill="#e8f0ff" stroke="#4b7bec" stroke-width="2"/><text x="56" y="588" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Customer story</text><text x="56" y="614" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Made-up payment and note</text><rect x="350" y="125" width="1520" height="630" rx="20" fill="#ffffff" stroke="#9aa8c0" stroke-width="2.5"/><text x="372" y="155" font-size="18" font-weight="700" fill="#5b6b86" text-anchor="start">Google Cloud project  last-mile-guard-510814  ·  region us-central1</text><rect x="380" y="175" width="1190" height="560" rx="18" fill="#eaf7f0" stroke="#2e9b6a" stroke-width="2.5"/><text x="402" y="205" font-size="18" font-weight="700" fill="#2e9b6a" text-anchor="start">Cloud Run service  (scales from 0 to 2 copies · 512 MiB · 20 requests per copy)</text><rect x="400" y="225" width="330" height="90" rx="14" fill="#e8f0ff" stroke="#4b7bec" stroke-width="2"/><text x="416" y="253" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Static web app</text><text x="416" y="279" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• React pages</text><rect x="750" y="225" width="800" height="90" rx="14" fill="#ffffff" stroke="#2e9b6a" stroke-width="2"/><text x="766" y="253" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">FastAPI backend</text><text x="766" y="279" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• /assess /assess/stream /conversation /arena /health</text><rect x="400" y="330" width="1150" height="76" rx="14" fill="#fdeaea" stroke="#d64545" stroke-width="2"/><text x="416" y="358" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Front-door guards</text><text x="416" y="384" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Security headers · size limits · rate limits · run caps</text><text x="402" y="432" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">What happens to one payment, in order</text><rect x="400" y="450" width="172" height="120" rx="14" fill="#ffffff" stroke="#2e9b6a" stroke-width="2"/><circle cx="424" cy="476" r="15" fill="#14213d"/><text x="424" y="481" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="446" y="482" font-size="16.5" font-weight="700" fill="#14213d" text-anchor="start">Validate</text><text x="414" y="516" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Typed checks on the</text><text x="414" y="535" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">request</text><line x1="572" y1="545" x2="594" y2="545" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="594" y="450" width="172" height="120" rx="14" fill="#ffffff" stroke="#2e9b6a" stroke-width="2"/><circle cx="618" cy="476" r="15" fill="#14213d"/><text x="618" y="481" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="640" y="482" font-size="16.5" font-weight="700" fill="#14213d" text-anchor="start">Behaviour rules</text><text x="608" y="516" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Score from 0 to 100</text><line x1="766" y1="545" x2="788" y2="545" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="788" y="450" width="172" height="120" rx="14" fill="#ffffff" stroke="#2e9b6a" stroke-width="2"/><circle cx="812" cy="476" r="15" fill="#14213d"/><text x="812" y="481" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="834" y="482" font-size="16.5" font-weight="700" fill="#14213d" text-anchor="start">MuleNet check</text><text x="802" y="516" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Account network adds</text><text x="802" y="535" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">points</text><line x1="960" y1="545" x2="982" y2="545" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="982" y="450" width="172" height="120" rx="14" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/><circle cx="1006" cy="476" r="15" fill="#14213d"/><text x="1006" y="481" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1028" y="482" font-size="16.5" font-weight="700" fill="#14213d" text-anchor="start">Message reader</text><text x="996" y="516" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Gemini spots scam</text><text x="996" y="535" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">tricks</text><line x1="1154" y1="545" x2="1176" y2="545" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="1176" y="450" width="172" height="120" rx="14" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/><circle cx="1200" cy="476" r="15" fill="#14213d"/><text x="1200" y="481" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1222" y="482" font-size="16.5" font-weight="700" fill="#14213d" text-anchor="start">One question</text><text x="1190" y="516" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Gemini asks and reads</text><text x="1190" y="535" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">the answer</text><line x1="1348" y1="545" x2="1370" y2="545" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="1370" y="450" width="172" height="120" rx="14" fill="#ffffff" stroke="#2e9b6a" stroke-width="2"/><circle cx="1394" cy="476" r="15" fill="#14213d"/><text x="1394" y="481" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1416" y="482" font-size="16.5" font-weight="700" fill="#14213d" text-anchor="start">Decision</text><text x="1384" y="516" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Allow, Warn or Hold</text><text x="400" y="600" font-size="15" font-weight="700" fill="#e08a00" text-anchor="start">Orange = uses Gemini</text><rect x="400" y="625" width="560" height="90" rx="14" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/><text x="416" y="653" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">If Gemini cannot help</text><text x="416" y="679" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• The rules decide alone, and say so</text><rect x="990" y="625" width="560" height="90" rx="14" fill="#f1ecfb" stroke="#7a55c7" stroke-width="2"/><text x="1006" y="653" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Data and memory</text><text x="1006" y="679" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Made-up data in the image. No database</text><rect x="1600" y="175" width="240" height="170" rx="14" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/><text x="1616" y="203" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Vertex AI · Gemini</text><text x="1616" y="229" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Fast model reads and asks</text><text x="1616" y="253" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Smarter model for hard</text><text x="1616" y="273" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">  cases</text><text x="1616" y="297" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Location: global</text><rect x="1600" y="370" width="240" height="120" rx="14" fill="#fdeaea" stroke="#d64545" stroke-width="2"/><text x="1616" y="398" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Identity, no keys</text><text x="1616" y="424" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Service account lmg-runtime</text><text x="1616" y="448" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Vertex AI User only</text><rect x="1600" y="625" width="240" height="90" rx="14" fill="#f1ecfb" stroke="#7a55c7" stroke-width="2"/><text x="1616" y="653" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Cloud Logging</text><text x="1616" y="679" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Request logs</text><line x1="310" y1="270" x2="380" y2="270" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><text x="345" y="255" font-size="13" font-weight="600" fill="#4a5568" text-anchor="middle">HTTPS</text><line x1="175" y1="420" x2="175" y2="300" stroke="#5b6b86" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="196" y="365" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start">text</text><polyline points="1068,450 1068,432 1570,432" fill="none" stroke="#e08a00" stroke-width="2.6"/><line x1="1262" y1="450" x2="1262" y2="432" stroke="#e08a00" stroke-width="2.6"/><line x1="1570" y1="432" x2="1600" y2="432" stroke="#e08a00" stroke-width="2.6" marker-end="url(#ah)"/><text x="1420" y="422" font-size="13" font-weight="600" fill="#e08a00" text-anchor="middle">Vertex AI calls</text><text x="40" y="830" font-size="21" font-weight="700" fill="#14213d" text-anchor="start">How a change reaches the live site</text><rect x="40" y="860" width="320" height="90" rx="14" fill="#eef2f7" stroke="#6b7a90" stroke-width="2"/><text x="56" y="888" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">GitHub</text><text x="56" y="914" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• develop branch</text><line x1="360" y1="905" x2="415" y2="905" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="415" y="860" width="320" height="90" rx="14" fill="#eef2f7" stroke="#6b7a90" stroke-width="2"/><text x="431" y="888" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Cloud Shell</text><text x="431" y="914" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• deploy script and billing check</text><line x1="735" y1="905" x2="790" y2="905" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="790" y="860" width="320" height="90" rx="14" fill="#eef2f7" stroke="#6b7a90" stroke-width="2"/><text x="806" y="888" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Cloud Build</text><text x="806" y="914" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Builds web pages and server</text><line x1="1110" y1="905" x2="1165" y2="905" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="1165" y="860" width="320" height="90" rx="14" fill="#eef2f7" stroke="#6b7a90" stroke-width="2"/><text x="1181" y="888" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Artifact Registry</text><text x="1181" y="914" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Container image</text><line x1="1485" y1="905" x2="1540" y2="905" stroke="#5b6b86" stroke-width="2.6" marker-end="url(#ah)"/><rect x="1540" y="860" width="320" height="90" rx="14" fill="#eef2f7" stroke="#6b7a90" stroke-width="2"/><text x="1556" y="888" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Cloud Run revision</text><text x="1556" y="914" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Takes all traffic</text><line x1="1700" y1="860" x2="1700" y2="758" stroke="#2e9b6a" stroke-width="2.6" marker-end="url(#ah)"/><text x="1765" y="815" font-size="13" font-weight="600" fill="#4a5568" text-anchor="middle">new revision</text><rect x="40" y="985" width="1820" height="85" rx="14" fill="#f1ecfb" stroke="#7a55c7" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="1013" font-size="17" font-weight="700" fill="#14213d" text-anchor="start">Offline testing, not part of the live site</text><text x="56" y="1039" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">• Made-up scenarios replayed from Cloud Shell, scored, results saved to a private repo</text></svg>